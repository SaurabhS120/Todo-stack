# Use postgres/example user/password credentials
version: '3.1'

services:
  db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=notesdb  # Ensure this matches your app's database name
    volumes:
      - pgdata:/var/lib/postgresql/data
      - "./back_end/sql container/init.sql:/docker-entrypoint-initdb.d/init.sql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notesdb"]
      interval: 10s
      retries: 5
      timeout: 5s

  adminer:
    image: adminer
    restart: always
    ports:
      - 8000:8080
  notes_express_server:
    build:
      context: back_end/express_js
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    links:
      - "db:database"
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./front_end/html_web:/var/www/html  # Mount your local html directory to the container's document root
      - ./front_end/html_web/nginx.conf:/etc/nginx/conf.d/default.conf:ro  # Mount your custom Nginx configuration (optional)

volumes:
  pgdata: